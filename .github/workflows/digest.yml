name: Daily HN digest

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 8:00 AM IST
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: read
  actions: write            # lets the keepalive step re-enable this workflow

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # GitHub turns off scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow every run resets that timer, so it never gets turned off.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/digest.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
